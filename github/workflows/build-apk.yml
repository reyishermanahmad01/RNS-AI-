
name: Build RNS AI APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode RNS AI
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependensi
        run: npm install

      - name: Siapkan halaman aplikasi
        run: npm run build

      - name: Buat proyek Android
        run: npx cap add android

      - name: Sinkronisasi Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: RNS-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
